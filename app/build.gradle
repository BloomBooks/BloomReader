plugins {
    id 'com.android.application'
    id 'com.github.triplet.play' version '2.8.0'
}

// This is the master definition of what version of Bloom Reader we are building
// NOTE: CI derives the patch number by counting commits since the last commit
// that changed the two lines below, so any edit to them (even reformatting)
// resets the published patch number to 0. Touch them only to bump the version.
def versionMajor = 3
def versionMinor = 4
def versionRelease = getVersionRelease()

int getVersionRelease() {
    def fullVersionNumberFromBuildSystem = project.ext.properties['build.number'] ?: "0" // default for non-tc
    List tokens = fullVersionNumberFromBuildSystem.tokenize('.')
    return Integer.parseInt(tokens.last())
}

// Load our credentials
def keystorePropertiesFileName = "${System.properties['user.home']}${File.separator}keystore${File.separator}keystore_bloom_reader.properties"
def keystoreProperties
def keystorePropertiesFile = rootProject.file(keystorePropertiesFileName)
if (keystorePropertiesFile.exists()) {
    keystoreProperties = new Properties()
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    /**
     * compileSdk specifies the Android API level Gradle should use to
     * compile your app. This means your app can use the API features included in
     * this API level and lower.
     */
    compileSdk 36

    defaultConfig {
        applicationId "org.sil.bloom.reader"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode versionMajor * 100000 + versionMinor * 1000 + versionRelease.toInteger()
        versionName "${versionMajor}.${versionMinor}.${versionRelease}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary true
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (keystoreProperties) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled true
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    flavorDimensions = ["default"] // To satisfy stupid new requirement in AS3.0.1

    productFlavors {
        alpha {
            applicationIdSuffix ".alpha"
            versionNameSuffix "-alpha"
            signingConfig signingConfigs.release
            dimension 'default'
        }
        // We don't currently publish a beta; the Play Store shut down the
        // BR Beta app. Restore this block if that ever changes.
        // beta {
        //     applicationIdSuffix ".beta"
        //     versionNameSuffix "-beta"
        //     signingConfig signingConfigs.release
        //     dimension 'default'
        // }
        production {
            // no id or version name suffix; this is the main product.
            signingConfig signingConfigs.release
            dimension 'default'
        }
    }

    play {
        if (keystoreProperties) {
            serviceAccountCredentials = file(keystoreProperties['serviceAccountJsonFile'])
        } else {
            serviceAccountCredentials = file("dummy.json")
        }

        // We default to always uploading to internal initially. This makes the new apk
        // available much sooner for testing. Then we can promote it to whichever channel we
        // want either manually or using another task (like promoteAlphaReleaseArtifact... see below).
        track = "internal"

        // Used for the promote*Artifact tasks
        fromTrack = "internal"
        promoteTrack = "beta"

        // CI passes -PplayDryRun=true to build, sign, and upload to a Play
        // edit without committing it, so nothing changes in the Play Console.
        commit = findProperty('playDryRun') != 'true'
    }

    playConfigs {
        alpha {
            // Alpha is sometimes rebuilt with no new commit (e.g. when a
            // bloom-player update dispatches the CI workflow), which would
            // reuse the same git-derived versionCode and be rejected as a
            // duplicate. "auto" asks Play for the highest published code and
            // uses max(local, highest + 1), so such rebuilds step past the
            // collision while normal builds keep their derived number.
            // Production deliberately keeps the default ("fail"): it is never
            // rebuilt without a commit, so a duplicate there means something
            // is wrong.
            // Gated on credentials because "auto" wires a Play API call into
            // the alpha release build, which would break local builds that
            // have no credentials (and no ability to publish anyway).
            resolutionStrategy = keystoreProperties ? "auto" : "fail"
            // Runs after resolution: keep the visible version name in sync
            // with the (possibly bumped) final version code.
            outputProcessor { output ->
                int code = output.versionCodeOverride > 0 ? output.versionCodeOverride : output.versionCode
                output.versionNameOverride = "${code.intdiv(100000)}.${(code % 100000).intdiv(1000)}.${code % 1000}-alpha"
            }
        }
        production {
            // Each production release must continue to offer the legacy 1.4
            // build (versionCode 104001) so devices below our current
            // minSdkVersion keep getting a working app. Retaining it here
            // means every publish includes it automatically instead of
            // relying on a manual step in the Play Console.
            retain.artifacts = [104001L]
        }
    }

    testOptions {
        animationsDisabled = true
    }
    lint {
        warning 'MissingTranslation', 'ExtraTranslation'
    }
    namespace 'org.sil.bloom.reader'
    buildFeatures {
        buildConfig true
    }
}

// Fail any production publish that is not going to retain the legacy 1.4 APK
// (see the playConfigs block above) rather than let a release silently drop
// it -- e.g. if a gradle-play-publisher upgrade changes how retain is
// configured or applied. This reads the merged config off the publish task
// itself (the value the task will actually use). The hasProperty filter
// skips the plugin's plain "...Wrapper" companion tasks, which carry no
// config; the isEmpty check keeps this loud if a plugin upgrade renames
// everything and the filter no longer matches any task at all.
project.afterEvaluate {
    def guarded = tasks.findAll {
        it.name.startsWith('publishProduction') && it.hasProperty('extension')
    }
    if (guarded.isEmpty()) {
        throw new GradleException("Found no gradle-play-publisher production publish tasks to guard. Did a plugin upgrade change task or property names? Update the legacy-1.4-APK retain check (near playConfigs in app/build.gradle) to match.")
    }
    guarded.each { task ->
        task.doFirst {
            def retained = task.extension.retain.artifacts
            if (retained == null || !retained.contains(104001L)) {
                throw new GradleException("${task.name} is not configured to retain the legacy 1.4 APK (versionCode 104001). See playConfigs in app/build.gradle.")
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Supports the WiFi module's 'server' used to receive books from Bloom desktop
    implementation  'cz.msebera.android:httpclient:4.5.8'

    implementation 'com.segment.analytics.android:analytics:4.11.3'

    implementation  'commons-io:commons-io:2.19.0'

    // Needed (at least) for making tar archives to send multiple books.
    // We tried commons-io:commons-compress but it didn't work for unknown/forgotten reasons
    implementation  'org.apache.commons:commons-compress:1.27.1'

    testImplementation  'junit:junit:4.13.2'
    testImplementation  'org.mockito:mockito-core:5.18.0'
    testImplementation  'org.json:json:20250517'  // make org.json classes available in unit tests

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.6.1'
}

tasks.register('copyBloomPlayerAssets', Copy) {
    from "node_modules/bloom-player/dist", "node_modules/bloom-player/package.json"
    into "src/main/assets/bloom-player"
    exclude '*.map', 'bloomPlayer.js'
}

// I'm chalking this up to one of those magical Android incantations you never
// really understand. Essentially, upgrading to the 34 sdk (or the latest gradle
// or something else which I upgraded at the same time) started forcing me to
// say that my custom task needed to be run before all these others.
// I applied no logic to creating the list. I just added them until the errors stopped.
// The .*?s cover all the alpha/beta/production and debug/release combos
// as well as lint/lintVital.
project.afterEvaluate {
    tasks.configureEach { task ->
        if (
                task.name.matches('^merge.*?Assets$') ||
                task.name.matches('^generate.*?Lint.*?ReportModel$') ||
                task.name.matches('^lint.*?Analyze.*?')
        ) {
            task.dependsOn copyBloomPlayerAssets
        }
    }
}

